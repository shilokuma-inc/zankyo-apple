# ビルド（＋テスト）の共通処理。build.yml から workflow_call で呼び出される。
name: _build

on:
  workflow_call:
    inputs:
      xcode-version:
        description: maxim-lobanov/setup-xcode に渡す Xcode バージョン
        type: string
        # README の Environment と揃える。ランナー側の更新でビルドが変わらないよう固定する
        default: '26.3'
      ui-tests:
        description: UI テスト（<プロジェクト名>UITests）も実行するか。false なら Unit テストだけ実行する
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow SwiftLint build tool plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Set up environment
        # プロジェクト名と同名の共有スキームが存在することを前提にする
        run: |
          project=$(basename -s .xcodeproj ./*.xcodeproj)
          echo "PROJECT_NAME=$project" >> "$GITHUB_ENV"
          echo "SCHEME=$project" >> "$GITHUB_ENV"
          # 最新の iOS ランタイムに存在する iPhone シミュレータを UDID で選ぶ
          # （名前だけの指定は OS:latest を暗黙に要求し、古いランタイムにしかないデバイスだと解決できない）
          simulator=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | map(select(.key | contains("SimRuntime.iOS"))) | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber),(.min|tonumber)]) | reverse | map(.value[] | select(.name | startswith("iPhone"))) | .[0]')
          echo "SIMULATOR_ID=$(jq -r .udid <<<"$simulator")" >> "$GITHUB_ENV"
          echo "project=$project scheme=$project simulator=$(jq -r '"\(.name) (\(.udid))"' <<<"$simulator")"

      # ogg-swift / vorbis-swift は中身を gitlab.xiph.org のサブモジュールから取るため、毎回取り直すと
      # 取得元が落ちたときにすべてのビルドが止まる（解決にかかる時間も 24〜262 秒とばらつく）。解決できた SourcePackages を保存して使い回す。
      # 復元できれば、取得元に届かなくても解決とビルドが通る
      - name: Restore Swift packages
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: DerivedData/SourcePackages
          # restore-keys は付けない。依存が変わったときに古い依存入りのキャッシュを復元し、そのまま保存し直して肥大化するため
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -derivedDataPath DerivedData

      # 後のテストが落ちた回でも、解決できた依存は保存する（actions/cache の後処理での保存は、ジョブが成功したときだけ）
      - name: Save Swift packages
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: SwiftLint
        # Build Tool Plugin と同じバージョンの SwiftLint（SPM が解決したバイナリ）で .swiftlint.yml を検証する
        run: |
          swiftlint=$(find DerivedData/SourcePackages/artifacts -type f -name swiftlint -path '*macos*' | head -1)
          if [[ -z "$swiftlint" ]]; then
            echo "::error::SPM が解決した SwiftLint バイナリが見つかりません" >&2
            exit 1
          fi
          "$swiftlint" version
          "$swiftlint" lint --strict --reporter github-actions-logging

      - name: Build and test
        # UI テストは共有ランナー上で起動待ちに失敗することがあるため、失敗したテストだけ最大 2 回まで再試行する
        env:
          UI_TESTS: ${{ inputs.ui-tests }}
        run: |
          options=()
          if [[ "$UI_TESTS" != "true" ]]; then
            # UI テストは Simulator の clone と起動を含めて 2 分前後かかるため、作業ブランチでは省く
            options+=(-skip-testing:"${SCHEME}UITests")
          fi
          # 並列テストを有効にすると Simulator の clone を作って起動するため、clone を作らずに実行する
          xcodebuild test \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            ${options[@]+"${options[@]}"}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
